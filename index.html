<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anmol Chandiok — Temporarily Offline</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root{color-scheme:light;--bg:#EDEDEA;--ink:#000;--muted:#6E6E6A;--accent:#FB5607}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
    body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:grid;place-items:center;padding:32px}
    main{width:min(760px,100%)}
    .top{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.02em;margin-bottom:20vh}
    .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block}
    .eyebrow{font-size:14px;color:var(--muted);margin-bottom:18px}
    h1{font-size:clamp(52px,9vw,110px);line-height:.9;letter-spacing:-.06em;margin:0 0 24px}
    p{font-size:clamp(18px,2vw,22px);line-height:1.45;color:var(--muted);max-width:32ch;margin:0}
    footer{margin-top:64px;font-size:13px;color:var(--muted)}
  </style>
</head>
<body>
  <main>
    <div class="top"><span class="dot"></span>Anmol Chandiok</div>
    <div class="eyebrow">Portfolio</div>
    <h1>Temporarily offline.</h1>
    <p>The portfolio is currently being updated. Please check back soon.</p>
    <footer>© 2026 Anmol Chandiok, Pluseshot</footer>
  </main>
</body>
</html>

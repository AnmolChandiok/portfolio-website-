<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmol Chandiok — Smart Preview</title>
  <style>
    body{margin:0;background:#111;color:#eee;font:14px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}
    .status{padding:18px 22px;border:1px solid #333;border-radius:12px;background:#191919}
    .error{color:#ff8f70;max-width:70ch;line-height:1.5}
  </style>
</head>
<body>
  <div class="status" id="status">Loading the site and applying preview upgrades…</div>
<script>
(async function(){
  const SOURCE = "https://anmolchandiok.github.io/portfolio-website-/index.html";
  const BASE = "https://anmolchandiok.github.io/portfolio-website-/";
  const CSS = String.raw`
html[data-theme="light"]{ color-scheme:light; }
html[data-theme="dark"]{
  --bg:#101010; --ink:#F1F1EE; --muted:#9A9A95; --line:#2B2B2A; --card:#1B1B1A;
  color-scheme:dark;
}
.theme-toggle{
  width:40px;height:40px;border-radius:999px;border:1px solid var(--line);
  display:inline-grid;place-items:center;color:var(--ink);background:transparent;
  transition:background .2s,border-color .2s,color .2s;flex-shrink:0;
}
.theme-toggle:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.theme-toggle svg{width:16px;height:16px;display:block}
html[data-theme="light"] .theme-toggle .icon-sun{display:none}
html[data-theme="dark"] .theme-toggle .icon-moon{display:none}
.smart-hover-blur{
  position:fixed;inset:0;z-index:40;
  background:rgba(12,12,12,.32);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  opacity:0;pointer-events:none;
  transition:opacity .35s ease;
}
.smart-hover-blur.on{opacity:1;}
.smart-preview-lift{
  position:fixed;z-index:80;overflow:hidden;pointer-events:none;
  border-radius:12px;background:#000;
  box-shadow:0 30px 70px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08);
  transform:scale(.96);opacity:0;
  transition:transform .35s cubic-bezier(.22,1,.36,1),opacity .28s ease;
}
.smart-preview-lift.on{transform:scale(1);opacity:1;}
.smart-preview-lift iframe{
  position:absolute;left:50%;top:50%;width:130%;height:130%;
  transform:translate(-50%,-50%);
  border:0;background:#000;pointer-events:none;
}
.vcard.smart-active .vplay{opacity:0;}
#workGrid.jgrid .vcard,#awGrid.jgrid .vcard{border-radius:12px;}
#workGrid.jgrid .vplay{--s:42px;}
@media (hover:hover) and (pointer:fine){
  html.smart-preview-on .nav{z-index:90;}
}
@media (max-width:640px){
  #lightbox{
    padding:0 !important;gap:0 !important;
    align-items:flex-end !important;justify-content:center !important;
    background:rgba(4,4,5,.90) !important;
  }
  #lightbox .lb-frame{
    width:min(100vw, calc(76svh * 16 / 9)) !important;
    max-width:100vw !important;max-height:76svh !important;
    aspect-ratio:16/9 !important;
    border-radius:18px 18px 0 0 !important;margin:0 auto !important;transform:none !important;
  }
  #lightbox .lb-frame.is-vertical{
    width:min(100vw, calc(76svh * 9 / 16)) !important;
    height:min(76svh, calc(100vw * 16 / 9)) !important;
    aspect-ratio:9/16 !important;
  }
  #lightbox .lb-title{
    width:100%;box-sizing:border-box;margin:0 !important;
    padding:14px 66px 14px 16px !important;min-height:54px;
    display:flex;align-items:center;
    background:var(--card,#1b1b1a) !important;color:var(--ink,#f1f1ee) !important;
    border-radius:0 0 18px 18px;text-align:left !important;
    font-size:14px !important;line-height:1.35;
  }
  #lightbox .lb-close{
    top:auto !important;bottom:calc(10px + env(safe-area-inset-bottom)) !important;
    right:14px !important;z-index:5;padding:8px 12px !important;border-radius:999px !important;
    background:rgba(0,0,0,.35) !important;color:#F1F1EE !important;
    border-color:rgba(255,255,255,.22) !important;
  }
}
`;
  const JS = String.raw`
(function(){
  'use strict';
  const root = document.documentElement;
  const THEME_KEY = 'anmol-theme';
  function currentTheme(){ return root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
  function setTheme(theme){
    const next = theme === 'dark' ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
    const meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute('content', next === 'dark' ? '#101010' : '#EDEDEA');
    const btn = document.getElementById('themeToggle');
    if(btn){
      const toDark = next === 'light';
      btn.setAttribute('aria-label', toDark ? 'Switch to dark mode' : 'Switch to light mode');
      btn.title = toDark ? 'Switch to dark mode' : 'Switch to light mode';
    }
  }
  function bootTheme(){
    let saved = null;
    try{ saved = localStorage.getItem(THEME_KEY); }catch(e){}
    setTheme(saved === 'dark' || saved === 'light' ? saved : 'light');
  }
  function ensureThemeButton(){
    if(document.getElementById('themeToggle')) return;
    const host = document.querySelector('.nav-right') || document.querySelector('.nav');
    if(!host) return;
    const btn = document.createElement('button');
    btn.className = 'theme-toggle';
    btn.id = 'themeToggle';
    btn.type = 'button';
    btn.innerHTML = '<svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
    const pill = host.querySelector('.pill, #navCta');
    if(pill) host.insertBefore(btn, pill);
    else host.insertBefore(btn, host.firstChild);
    btn.addEventListener('click', function(){ setTheme(currentTheme()==='dark'?'light':'dark'); });
    setTheme(currentTheme());
  }
  const desktop = matchMedia('(hover:hover) and (pointer:fine)');
  const blur = document.createElement('div');
  blur.className = 'smart-hover-blur';
  blur.setAttribute('aria-hidden','true');
  document.body.appendChild(blur);
  let activeCard = null, sourceCard = null, lastX = -1, lastY = -1;
  document.addEventListener('mousemove', function(e){ lastX = e.clientX; lastY = e.clientY; }, {passive:true});
  function videoId(card){
    if(card.dataset.videoId) return card.dataset.videoId;
    const img = card.querySelector('.vmedia img');
    const src = img && (img.currentSrc || img.getAttribute('src') || img.src || '');
    const m = String(src).match(/\/vi\/([^/]+)\//);
    return m ? m[1] : null;
  }
  function ytPreview(id){
    const p = {autoplay:1,mute:1,controls:0,disablekb:1,iv_load_policy:3,playsinline:1,rel:0,modestbranding:1,fs:0,cc_load_policy:0};
    return 'https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?'+Object.keys(p).map(function(k){return k+'='+encodeURIComponent(p[k]);}).join('&');
  }
  function startPreview(card){
    if(!card || card._smartPreview) return;
    const id = videoId(card); if(!id) return;
    card.dataset.videoId = id;
    const r = card.getBoundingClientRect();
    const scale = 1.14, w = r.width * scale, h = r.height * scale;
    const lift = document.createElement('div');
    lift.className = 'smart-preview-lift';
    lift.style.left = (r.left - (w - r.width) / 2) + 'px';
    lift.style.top = (r.top - (h - r.height) / 2) + 'px';
    lift.style.width = w + 'px';
    lift.style.height = h + 'px';
    const frame = document.createElement('iframe');
    frame.src = ytPreview(id);
    frame.allow = 'autoplay; encrypted-media; picture-in-picture';
    frame.setAttribute('tabindex','-1');
    frame.setAttribute('aria-hidden','true');
    lift.appendChild(frame);
    document.body.appendChild(lift);
    requestAnimationFrame(function(){ lift.classList.add('on'); });
    card._smartPreview = lift;
  }
  function stopPreview(card){
    if(!card || !card._smartPreview) return;
    card._smartPreview.remove();
    card._smartPreview = null;
  }
  function activate(card){
    if(!card || !desktop.matches) return;
    const lb = document.getElementById('lightbox');
    if(lb && lb.classList.contains('open')) return;
    if(activeCard && activeCard !== card) deactivate(activeCard);
    activeCard = card;
    root.classList.add('smart-preview-on');
    card.classList.add('smart-active');
    blur.classList.add('on');
    startPreview(card);
  }
  function deactivate(card){
    if(!card || card._smartLocked) return;
    card.classList.remove('smart-active');
    stopPreview(card);
    if(activeCard === card) activeCard = null;
    if(!activeCard){ blur.classList.remove('on'); root.classList.remove('smart-preview-on'); }
  }
  function attach(card){
    if(card._smartAttached || !card.classList.contains('vcard')) return;
    card._smartAttached = true;
    if(!card.dataset.videoId){ const id = videoId(card); if(id) card.dataset.videoId = id; }
    card.addEventListener('mouseenter', function(){ activate(card); });
    card.addEventListener('mouseleave', function(){ deactivate(card); });
  }
  function attachAll(){ document.querySelectorAll('.vcard').forEach(attach); }
  document.addEventListener('click', function(e){
    const card = e.target.closest && e.target.closest('.vcard');
    if(!card || !card.classList.contains('smart-active')) return;
    sourceCard = card; card._smartLocked = true;
  }, true);
  const lb = document.getElementById('lightbox');
  const close = document.getElementById('lbClose');
  function reconcile(){
    const card = sourceCard; sourceCard = null; if(!card) return;
    card._smartLocked = false;
    const el = document.elementFromPoint(lastX, lastY);
    if(el && el.closest && el.closest('.vcard') === card) activate(card); else deactivate(card);
  }
  if(close) close.addEventListener('click', function(){ setTimeout(reconcile, 30); });
  if(lb) new MutationObserver(function(){
    if(!lb.classList.contains('open') && sourceCard) setTimeout(reconcile, 20);
  }).observe(lb, {attributes:true, attributeFilter:['class']});
  function isPortrait(card){
    if(typeof card._ratio === 'number') return card._ratio < 1;
    return String(card.style.getPropertyValue('--ratio')||'').replace(/\s/g,'') === '9/16';
  }
  function placeCard(el,x,y,w,h){
    el.style.left = Math.round(x)+'px';
    el.style.top = Math.round(y)+'px';
    el.style.width = Math.round(w)+'px';
    el.style.height = Math.round(h)+'px';
    el.style.position = 'absolute';
  }
  function layoutBento(grid){
    if(!grid) return;
    const cards = [...grid.querySelectorAll('.vcard')].filter(c => c.style.display !== 'none' && !c.classList.contains('is-empty'));
    const W = grid.clientWidth;
    if(!W || !cards.length){ grid.style.height = '0px'; return; }
    const gap = innerWidth < 640 ? 10 : 16;
    let y = 0;
    if(innerWidth < 720){
      const queue = cards.slice(); const rows = [];
      while(queue.length){
        const c = queue.shift();
        if(!isPortrait(c)){ rows.push([c]); continue; }
        let pair = -1;
        for(let i=0;i<queue.length;i++) if(isPortrait(queue[i])){ pair=i; break; }
        rows.push(pair===-1 ? [c] : [c, queue.splice(pair,1)[0]]);
      }
      rows.forEach(row => {
        if(row.length===2){
          const w=(W-gap)/2, h=w*16/9;
          placeCard(row[0],0,y,w,h); placeCard(row[1],w+gap,y,w,h); y+=h+gap;
        }else{
          const h = isPortrait(row[0]) ? W*16/9 : W*9/16;
          placeCard(row[0],0,y,W,h); y+=h+gap;
        }
      });
      grid.style.height = Math.max(0,y-gap)+'px';
      return;
    }
    const land = cards.filter(c => !isPortrait(c));
    const port = cards.filter(c => isPortrait(c));
    const used = new Set();
    function take(list){ const c = list.find(item => !used.has(item)); if(c) used.add(c); return c || null; }
    while(used.size < cards.length){
      const freeL = land.filter(c => !used.has(c));
      const freeP = port.filter(c => !used.has(c));
      if(freeL.length >= 2 && freeP.length >= 1){
        const a = take(land), b = take(land), p = take(port);
        const leftW = Math.round(W * 0.64);
        const rightW = W - leftW - gap;
        const landH = leftW * 9 / 16;
        const totalH = landH * 2 + gap;
        const portW = Math.min(rightW, totalH * 9 / 16);
        const portX = leftW + gap + Math.max(0, (rightW - portW) / 2);
        placeCard(a, 0, y, leftW, landH);
        placeCard(b, 0, y + landH + gap, leftW, landH);
        placeCard(p, portX, y, portW, totalH);
        y += totalH + gap; continue;
      }
      if(freeL.length >= 1 && freeP.length >= 1){
        const a = take(land), p = take(port);
        const portW = Math.round(W * 0.34);
        const landW = W - portW - gap;
        const landH = landW * 9 / 16;
        const portH = Math.min(landH, portW * 16 / 9);
        const portY = y + Math.max(0, (landH - portH) / 2);
        placeCard(a, 0, y, landW, landH);
        placeCard(p, landW + gap, portY, portW, portH);
        y += landH + gap; continue;
      }
      if(freeL.length >= 2){
        const a = take(land), b = take(land);
        const w = (W - gap) / 2, h = w * 9 / 16;
        placeCard(a, 0, y, w, h); placeCard(b, w + gap, y, w, h);
        y += h + gap; continue;
      }
      if(freeL.length === 1){
        const a = take(land);
        const h = Math.min(W * 9 / 16, 520);
        placeCard(a, 0, y, W, h); y += h + gap; continue;
      }
      if(freeP.length){
        const cols = freeP.length === 1 ? 1 : (freeP.length === 2 || W < 1100 ? 2 : 3);
        const row = [];
        for(let i=0;i<cols;i++){ const c = take(port); if(c) row.push(c); }
        const w = (W - gap * (row.length - 1)) / row.length, h = w * 16 / 9;
        row.forEach((c,i) => placeCard(c, i * (w + gap), y, w, h));
        y += h + gap; continue;
      }
      break;
    }
    grid.style.height = Math.max(0, y - gap) + 'px';
  }
  function hijackGrid(id){
    const old = document.getElementById(id);
    if(!old) return null;
    if(old.dataset.bentoReady === '1') return old;
    const neu = old.cloneNode(false);
    neu.id = id;
    neu.dataset.bentoReady = '1';
    while(old.firstChild) neu.appendChild(old.firstChild);
    old.removeAttribute('id');
    old.style.display = 'none';
    old.setAttribute('aria-hidden','true');
    old.parentNode.insertBefore(neu, old);
    return neu;
  }
  function relayoutGrids(){
    layoutBento(hijackGrid('workGrid') || document.getElementById('workGrid'));
    layoutBento(document.getElementById('awGrid'));
  }
  bootTheme(); ensureThemeButton(); attachAll(); relayoutGrids();
  setTimeout(function(){ ensureThemeButton(); attachAll(); relayoutGrids(); }, 80);
  setTimeout(function(){ attachAll(); relayoutGrids(); }, 350);
  setTimeout(relayoutGrids, 1000);
  addEventListener('resize', function(){ relayoutGrids(); }, {passive:true});
  document.addEventListener('click', function(e){
    if(e.target.closest && (e.target.closest('[data-open-all]') || e.target.closest('#awFilters') || e.target.closest('#navLinks'))){
      setTimeout(function(){ attachAll(); relayoutGrids(); }, 80);
      setTimeout(function(){ attachAll(); relayoutGrids(); }, 400);
    }
  });
})();
`;
  try{
    const res = await fetch(SOURCE, {cache:'no-store'});
    if(!res.ok) throw new Error('Could not fetch the current deployed index.html (HTTP '+res.status+').');
    let html = await res.text();
    html = html.replace(/<head>/i, '<head>\n<base href="'+BASE+'">');
    html = html.replace(/<\/head>/i, '<style id="smart-local-css">'+CSS+'</style>\n</head>');
    html = html.replace(/<\/body>\s*<\/html>/i, '<script id="smart-local-js">'+JS+'<\/script>\n</body>\n</html>');
    document.open(); document.write(html); document.close();
  }catch(err){
    const status = document.getElementById('status');
    status.innerHTML = '<div class="error"><strong>Preview could not start.</strong><br>'+String(err.message||err)+'</div>';
  }
})();
</script>
</body>
</html>
